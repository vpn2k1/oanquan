name: o_quan_viet
description: "Ô Quan Việt — Đấu Trí Dân Gian: Ô ăn quan 2–4 người (Flutter + Flame)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  firebase_core: ^4.15.0
  firebase_remote_config: ^6.7.0
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_screenutil: ^5.9.3
  go_router: ^18.0.2
  google_mobile_ads: ^9.1.0
  intl: ^0.20.2
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/app_icon.png
    - assets/splash.png
    - assets/pebbles.png
    - assets/quan_stone.png
