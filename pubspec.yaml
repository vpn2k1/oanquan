name: o_quan_viet
description: "Ô ăn Quan Việt — Đấu Trí Dân Gian: Ô ăn quan 2–4 người (Flutter + Flame)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  firebase_core: ^4.15.0
  firebase_remote_config: ^6.7.0
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_screenutil: ^5.9.3
  go_router: ^18.0.2
  google_mobile_ads: ^9.1.0
  in_app_update: ^5.0.0
  intl: ^0.20.2
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/app_icon.png
    - assets/mode_2_players.png
    - assets/mode_3_players.png
    - assets/mode_4_players.png
    - assets/pebbles.png
    - assets/quan_stone.png
    - shorebird.yaml

flutter_native_splash:
  color: "#B55D2D"
  color_dark: "#B55D2D"
  image: assets/splash.png
  image_dark: assets/splash.png
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  fullscreen: true
  android_screen_orientation: sensorLandscape
  android_12:
    color: "#B55D2D"
    color_dark: "#B55D2D"
    image: assets/splash_android12.png
    image_dark: assets/splash_android12.png
    icon_background_color: "#B55D2D"
    icon_background_color_dark: "#B55D2D"
